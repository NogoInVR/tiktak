<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TokScroll</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    body{overflow:hidden}.feed{height:100dvh;width:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
    .feed::-webkit-scrollbar{display:none}.slide{height:100dvh;width:100%;position:relative;scroll-snap-align:start;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .video-wrap{width:100%;height:100%;position:absolute;inset:0}.video-wrap iframe{width:100%;height:100%;border:0}
    .shade{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.72));pointer-events:none}
    .info{position:absolute;left:18px;right:78px;bottom:30px;z-index:3;text-shadow:0 2px 8px #000}
    .user{font-weight:800;font-size:18px;margin-bottom:8px}.caption{font-size:15px;line-height:1.35;max-width:600px}
    .actions{position:absolute;right:14px;bottom:34px;z-index:4;display:flex;flex-direction:column;gap:18px;align-items:center}
    .action{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.38);color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(8px)}
    .action:active{transform:scale(.92)}.top{position:fixed;z-index:20;top:0;left:0;right:0;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#0009,transparent)}
    .brand{font-weight:900;font-size:21px}.status{font-size:12px;opacity:.8}.login{border:0;border-radius:999px;padding:10px 15px;background:#fff;color:#000;font-weight:800;cursor:pointer}
    .empty{padding:30px;text-align:center;max-width:560px}.empty h1{font-size:28px}.empty p{color:#bbb;line-height:1.5}.empty code{background:#222;padding:3px 6px;border-radius:5px}
    .spinner{width:35px;height:35px;border:3px solid #444;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;z-index:50;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 15px;border-radius:999px;display:none}
  </style>
</head>
<body>
  <header class="top">
    <div><div class="brand">TokScroll</div><div id="status" class="status">Loading…</div></div>
    <button id="login" class="login">Connect TikTok</button>
  </header>
  <main id="feed" class="feed">
    <section class="slide"><div class="spinner"></div></section>
  </main>
  <div id="toast" class="toast"></div>

<script>
const API_BASE = ""; // Leave empty when frontend + backend share a domain.
const feed = document.getElementById("feed");
const statusEl = document.getElementById("status");
const loginBtn = document.getElementById("login");

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2400)}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function addVideo(v){
  const slide=document.createElement("section");
  slide.className="slide";
  const embed=v.embed_link || "";
  slide.innerHTML=`
    <div class="video-wrap">${embed ? `<iframe src="${esc(embed)}" allow="autoplay; encrypted-media;" allowfullscreen></iframe>` : `<div class="empty"><h1>No embed available</h1><p>${esc(v.title||v.video_description||"TikTok video")}</p></div>`}</div>
    <div class="shade"></div>
    <div class="info"><div class="user">@${esc(v.author||"TikTok")}</div><div class="caption">${esc(v.title||v.video_description||"")}</div></div>
    <div class="actions">
      <button class="action" title="Open on TikTok" onclick="window.open('${esc(v.share_url||'#')}','_blank')">↗</button>
    </div>`;
  feed.appendChild(slide);
}

async function loadFeed(){
  try{
    const r=await fetch(API_BASE + "/api/videos");
    if(r.status===401){ statusEl.textContent="Not connected"; feed.innerHTML=`<section class="slide"><div class="empty"><h1>Connect TikTok</h1><p>Click <b>Connect TikTok</b> to authorize your account. TikTok's Display API returns the authorized user's videos.</p></div></section>`; return; }
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Request failed");
    feed.innerHTML="";
    const videos=data.videos||[];
    statusEl.textContent=`${videos.length} videos`;
    if(!videos.length){feed.innerHTML=`<section class="slide"><div class="empty"><h1>No videos found</h1><p>Post a few TikToks and reload.</p></div></section>`;return;}
    videos.forEach(addVideo);
  }catch(e){
    statusEl.textContent="API error";
    feed.innerHTML=`<section class="slide"><div class="empty"><h1>Couldn't load videos</h1><p>${esc(e.message)}<br><br>Check the setup in README.md.</p></div></section>`;
  }
}
loginBtn.onclick=()=>location.href=API_BASE+"/api/login";
loadFeed();
</script>
</body>
</html>
